[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chintu-adapters"
version = "0.5.0"
description = "Local, fail-closed Chintu agent adapters and deterministic fixtures"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
agent = ["claude-agent-sdk>=0.2,<1"]

[tool.setuptools.packages.find]
where = ["src"]
