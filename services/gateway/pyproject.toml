[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chintu-gateway"
version = "0.5.0"
description = "Private text-only Chintu gateway and durable fixture task manager"
requires-python = ">=3.12"
dependencies = ["fastapi==0.143.0", "starlette==1.9.0", "uvicorn>=0.30,<1", "jsonschema>=4.23,<5", "segno>=1.6,<2", "chintu-adapters>=0.1.0"]

[project.optional-dependencies]
test = ["httpx>=0.28,<1"]

[project.scripts]
chintu-gateway = "chintu_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
