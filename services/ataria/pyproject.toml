[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chintu-ataria"
version = "0.7.0rc1"
description = "Ataria engine for Chintu: scheduled agent jobs, a daily board, personal values only from a local profile"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5", "pyyaml>=6,<7"]

[project.scripts]
chintu-ataria = "chintu_ataria.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chintu_ataria = ["schema/*.json", "defaults/**/*.md", "defaults/web/*"]
