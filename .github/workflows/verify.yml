name: Verify prototype

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-and-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Python dependencies
        run: |
          python -m pip install uv==0.12.3
          uv venv --python 3.12
          uv pip sync --require-hashes requirements-dev.lock
          uv pip install --no-build-isolation --no-deps -e packages/agent-adapters -e services/gateway
      - name: Contract, lifecycle, adapters, integration and Android core
        run: make PYTHON=.venv/bin/python test demo
      - name: Lint the one-line installer
        run: shellcheck install.sh

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile APK and run lint
        run: |
          python3 apps/android/tools/android.py fetch
          python3 apps/android/tools/android.py build :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-debug-and-lint
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/reports/lint-results-debug.*
          if-no-files-found: warn

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan the whole history for leaked secrets (gitleaks, pinned by checksum)
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks" && tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" git --no-banner --redact=100 --exit-code 1 .
