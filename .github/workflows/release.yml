name: Release packages

# Builds the three distributables and attaches them to the GitHub release for the tag.
# Trigger: push a tag `vX.Y.Z` that matches the root VERSION file, or run manually.
# Secrets for the signed APK (set with scripts/package/set-signing-secrets.sh): CHINTU_KEYSTORE_B64
# (base64 of the release keystore), CHINTU_KEYSTORE_PASSWORD, CHINTU_KEY_PASSWORD. The key alias is
# not secret and is set below in plain text: as a secret, GitHub would mask every "chintu" in the logs.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore the release keystore from secrets
        env:
          CHINTU_KEYSTORE_B64: ${{ secrets.CHINTU_KEYSTORE_B64 }}
        run: |
          test -n "$CHINTU_KEYSTORE_B64" || { echo "CHINTU_KEYSTORE_B64 secret is not set"; exit 1; }
          umask 077
          echo "$CHINTU_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/chintu-release.jks"
          echo "CHINTU_KEYSTORE=$RUNNER_TEMP/chintu-release.jks" >> "$GITHUB_ENV"
      - name: Build and verify the signed APK
        env:
          CHINTU_KEYSTORE_PASSWORD: ${{ secrets.CHINTU_KEYSTORE_PASSWORD }}
          CHINTU_KEY_ALIAS: chintu
          CHINTU_KEY_PASSWORD: ${{ secrets.CHINTU_KEY_PASSWORD }}
        run: scripts/package/build-apk.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error

  deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build the Debian packages (amd64 and arm64)
        run: python3 scripts/package/build-deb.py
      - name: Install the amd64 package and smoke-test it
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/chintu-desktop_*_amd64.deb
          chintu-desktop --version
          chintu-desktop status --port 8790 | head -40
          chintu-desktop gateway --help > /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  dmg:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and verify the disk image
        run: scripts/package/build-dmg.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dmg
          path: dist/*.dmg
          if-no-files-found: error

  release:
    needs: [apk, deb, dmg]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then tag="v${version}"; fi
          if [ "$tag" != "v${version}" ]; then
            echo "Tag $tag does not match VERSION $version"; exit 1
          fi
          cp install.sh dist/
          (cd dist && sha256sum -- *.apk *.deb *.dmg install.sh > SHA256SUMS)
          ls -l dist
          cat dist/SHA256SUMS
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --title "Chintu $version" --notes-file docs/releases/"$tag".md \
              || gh release create "$tag" --title "Chintu $version" --generate-notes
          fi
          gh release upload "$tag" dist/* --clobber
