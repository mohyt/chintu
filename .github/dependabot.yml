version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directories:
      - /services/gateway
      - /packages/agent-adapters
      - /apps/desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
